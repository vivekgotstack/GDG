server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: meetgrid
  datasource:
    url: jdbc:h2:mem:meetgrid;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
meetgrid:
  demo-reset-enabled: ${DEMO_RESET_ENABLED:true}
