services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetgrid
      POSTGRES_USER: meetgrid
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetgrid -d meetgrid"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *logging
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meetgrid
      DB_USERNAME: meetgrid
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BIND_ADDRESS: 0.0.0.0
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
    stop_grace_period: 40s
    logging: *logging
volumes:
  postgres_data:
