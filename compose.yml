services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meetgrid
      POSTGRES_USER: meetgrid
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meetgrid}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - meetgrid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetgrid -d meetgrid"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  meetgrid-data:
